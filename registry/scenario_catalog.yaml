surface_detectors:
  login:
    display_name: "Form Đăng Nhập"
    endpoint_keywords: ["login", "signin", "doctorlogin"]
    param_keywords: ["password", "pswd", "passwd", "pwd"]
    text_patterns: ["\\blogin\\s+(?:form|page|screen|endpoint|portal|action)\\b"]
  renderer:
    display_name: "Trình Kết Xuất Dữ Liệu (Content/Markdown Renderer)"
    keywords: ["renderer", "markdown", "template", "bbcode", "parser"]
  file_overwrite:
    display_name: "Chức Năng Xử Lý Đường Dẫn / Ghi Đè Tệp Tin"
    text_patterns: ["\\bfile path validation\\b", "\\bpath validation\\b", "\\bpath traversal\\b", "\\barbitrary file overwrite\\b"]
  upload:
    display_name: "Chức Năng Tải Lên Tệp Tin"
    keywords: ["upload", "attachment", "avatar", "file_upload"]
  api:
    display_name: "Giao Diện Dữ Liệu (Data API)"
    keywords: ["getdataofjson", "json", "api/", "/api", "rest", "graphql", "rpc"]
  search:
    display_name: "Chức Năng Tìm Kiếm / Tra Cứu"
    keywords: ["search", "find", "query", "filter", "keyword"]
    param_keywords: ["q", "keyword"]
  container:
    display_name: "Môi Trường Container Runtime"
    keywords: ["runc", "container", "docker", "libcontainer", "cgroup", "namespace", "podman"]
  order_by:
    param_keywords: [
      "orderby", "order_by", "order", "sort", "sort_by", "sort_dir",
      "dir", "sort_order", "sortorder", "ordering", "sortfield",
      "sort_column", "sortcol", "sortkey", "direction"
    ]
    text_patterns: ["\\border\\s+by\\b", "\\bsort\\s+by\\b", "\\bsorting\\s+parameter\\b"]
  generic:
    display_name: "Yêu Cầu HTTP Ứng Dụng"

tech_detectors:
  backends:
    PHP: [".php", "wordpress", "drupal", "joomla", "filepress", "wuzhicms"]
    Java: [".jsp", ".do", "spring", "struts", "java"]
    Python: [".py", "django", "flask", "python"]
    "Node.js": ["node", "express", ".js"]
    "ASP.NET": [".asp", "iis", "dotnet", ".net"]
  databases:
    PostgreSQL: ["postgres", "pgsql"]
    Oracle: ["oracle", "ora-"]
    "Microsoft SQL Server": ["mssql", "sql server"]
    SQLite: ["sqlite"]

categories:
  SQLI:
    cwe_ids: ["CWE-89", "CWE-564", "CWE-943"]
    variants:
      - id_suffix: "error_based"
        name: "Khai Thác SQL Injection (Dạng Lỗi - Error Based)"
        order_by_name: "Khai Thác ORDER BY SQL Injection (Dạng Lỗi - Error Based)"
        techniques: ["TECH-ERROR_BASED"]
        channels: ["CHANNEL-HTTP"]
        oracles: ["ORACLE-RESPONSE"]
        constraints:
          - "CONSTRAINT-REMOTE-NETWORK-REACHABLE"
          - "CONSTRAINT-HTTP-SERVICE-REACHABLE"
          - "CONSTRAINT-SQL-BACKEND"
        probe_kind: "sql_error_probe"
      - id_suffix: "time_based"
        name: "Khai Thác SQL Injection (Dạng Trễ Thời Gian - Time Based Blind)"
        order_by_name: "Khai Thác ORDER BY SQL Injection (Dạng Trễ Thời Gian - Time Based Blind)"
        techniques: ["TECH-BLIND", "TECH-TIME_BASED"]
        channels: ["CHANNEL-HTTP"]
        oracles: ["ORACLE-RESPONSE"]
        constraints:
          - "CONSTRAINT-REMOTE-NETWORK-REACHABLE"
          - "CONSTRAINT-HTTP-SERVICE-REACHABLE"
          - "CONSTRAINT-SQL-BACKEND"
        probe_kind: "sql_time_delay_probe"
      - id_suffix: "auth_bypass"
        name: "Khai Thác SQL Injection Vượt Qua Xác Thực (Authentication Bypass)"
        techniques: ["TECH-BOOLEAN_BASED"]
        channels: ["CHANNEL-HTTP"]
        oracles: ["ORACLE-RESPONSE"]
        constraints:
          - "CONSTRAINT-REMOTE-NETWORK-REACHABLE"
          - "CONSTRAINT-HTTP-SERVICE-REACHABLE"
          - "CONSTRAINT-SQL-BACKEND"
        probe_kind: "sql_auth_bypass_probe"
        requires_component: "LOGIN_FORM"

  XSS:
    cwe_ids: ["CWE-79", "CWE-80"]
    variants:
      - id_suffix: "reflected"
        name: "Tấn Công XSS Phản Xạ (Reflected Cross-Site Scripting)"
        techniques: ["TECH-BLIND"]
        channels: ["CHANNEL-HTTP"]
        oracles: ["ORACLE-RESPONSE"]
        constraints:
          - "CONSTRAINT-REMOTE-NETWORK-REACHABLE"
          - "CONSTRAINT-HTTP-SERVICE-REACHABLE"
        probe_kind: "xss_script_probe"

  PATH_TRAVERSAL:
    cwe_ids: ["CWE-22", "CWE-23", "CWE-35"]
    variants:
      - id_suffix: "file_retrieval"
        name: "Đọc Tệp Tùy Ý Qua Lỗi Duyệt Thư Mục (Path Traversal)"
        techniques: ["TECH-ERROR_BASED", "TECH-BLIND"]
        channels: ["CHANNEL-HTTP"]
        oracles: ["ORACLE-RESPONSE"]
        constraints:
          - "CONSTRAINT-REMOTE-NETWORK-REACHABLE"
          - "CONSTRAINT-HTTP-SERVICE-REACHABLE"
        probe_kind: "path_traversal_probe"

  COMMAND_INJECTION:
    cwe_ids: ["CWE-78", "CWE-88", "CWE-77", "CWE-94"]
    variants:
      - id_suffix: "command_exec"
        name: "Chèn Và Thực Thi Lệnh Hệ Điều Hành (OS Command Injection)"
        techniques: ["TECH-BLIND", "TECH-TIME_BASED"]
        channels: ["CHANNEL-HTTP"]
        oracles: ["ORACLE-RESPONSE"]
        constraints:
          - "CONSTRAINT-REMOTE-NETWORK-REACHABLE"
          - "CONSTRAINT-HTTP-SERVICE-REACHABLE"
          - "CONSTRAINT-COMMAND-EXECUTION-PRIVILEGE"
        probe_kind: "os_command_probe"

  CREDENTIALS:
    cwe_ids: ["CWE-798", "CWE-259", "CWE-321", "CWE-1391"]
    variants:
      - id_suffix: "cred_spray"
        name: "Xác Thực Bằng Thông Tin Đăng Nhập Mặc Định / Hardcoded Credentials"
        techniques: ["TECH-BLIND", "TECH-ERROR_BASED"]
        channels: ["CHANNEL-HTTP"]
        oracles: ["ORACLE-RESPONSE"]
        constraints:
          - "CONSTRAINT-REMOTE-NETWORK-REACHABLE"
        probe_kind: "credential_spray_probe"

  SSRF:
    cwe_ids: ["CWE-918"]
    variants:
      - id_suffix: "oob_callback"
        name: "Gượng Ép Yêu Cầu Phía Máy Chủ (SSRF Out-of-Band Callback)"
        techniques: ["TECH-OUT_OF_BAND", "TECH-BLIND"]
        channels: ["CHANNEL-DNS", "CHANNEL-HTTP"]
        oracles: ["ORACLE-EXTERNAL-INTERACTION"]
        constraints:
          - "CONSTRAINT-REMOTE-NETWORK-REACHABLE"
          - "CONSTRAINT-HTTP-SERVICE-REACHABLE"
        probe_kind: "ssrf_callback_probe"

  XXE:
    cwe_ids: ["CWE-611", "CWE-827"]
    variants:
      - id_suffix: "entity_resolution"
        name: "Khai Thác Thực Thể Ngoài XML (XXE Entity Resolution)"
        techniques: ["TECH-OUT_OF_BAND"]
        channels: ["CHANNEL-DNS", "CHANNEL-HTTP"]
