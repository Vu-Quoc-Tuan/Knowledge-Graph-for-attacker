      default_header: "# [PoC] Thử nghiệm Arbitrary File Overwrite cho ⟦vulnerability_id⟧\n"
    xss:
      post_header: "# [PoC] Thử nghiệm XSS qua yêu cầu POST cho ⟦vulnerability_id⟧\n"
      get_header: "# [PoC] Thử nghiệm Reflected XSS cho ⟦vulnerability_id⟧\n"
    ssrf:
      header: "# [PoC] Thử nghiệm SSRF truy xuất metadata nội bộ cho ⟦vulnerability_id⟧\n"
    container_escape:
      body: "# [PoC] Kiểm tra rò rỉ File Descriptor vượt thoát container cho ⟦vulnerability_id⟧\n# 1. Liệt kê các file descriptor được mở trong tiến trình khách:\n"
