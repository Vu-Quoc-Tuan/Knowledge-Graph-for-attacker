      step_one: "# Bước 1: Gửi yêu cầu với định danh của phiên hợp lệ\n"
      step_two: "# Bước 2: Đổi ⟦parameter⟧ sang định danh của nạn nhân/quản trị viên khác (1002):\n"
    authentication_bypass:
      header: "# [PoC] Thử nghiệm bỏ qua xác thực (Authentication Bypass) cho ⟦vulnerability_id⟧\n"
    csrf:
