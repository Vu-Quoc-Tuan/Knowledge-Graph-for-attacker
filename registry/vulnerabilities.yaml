  # Legacy Fides/XSS description conflicts with the CVE/NVD record for this ID.
  - vuln_id: "CVE-2024-44541"
    title: "Reflected XSS in Fides via fides_description parameter"
    description: "An unauthenticated attacker can execute arbitrary JavaScript in the context of the user session by supplying a crafted fides_description query parameter that is rendered in consent UI without sanitization."
    published_at: "2024-09-05T00:00:00Z"
    cwe_id: "CWE-79"
    epistemic_status: "canonical"
    product:
      name: "Fides"
      vendor: "Ethyca"
    component:
      name: "fides.js"
      path: "clients/fides-js"
    version_ranges:
      - spec: "< 2.45.1"
        status: "affected"
    evidence:
      - evidence_id: "EVD-158a62c668b6bf04"
        kind: "advisory"
        source_ref: "https://github.com/ethyca/fides/security/advisories/GHSA-xxxx"
        source_hash: "sha256:158a62c668b6bf04f3d5d2304a063788f4b8d97f9d16037e09f5505bd7e662ec"
        excerpt: "An unauthenticated query parameter fides_description is rendered directly into the HTML DOM without proper encoding in fides.js."
    facts:
      input_vector: "URL_QUERY"
      input_parameter: "fides_description"
      mechanism: "UNSAFE_HTML_RENDER"
      impact: "SCRIPT_EXECUTION"
      precondition: "CONSENT_MODAL_ENABLED"

  - vuln_id: "CVE-2021-43798"
    title: "Path Traversal in Grafana via plugin assets endpoint"
    description: "Grafana versions 8.0.0 through 8.3.0 are vulnerable to directory traversal, allowing unauthorized access to local files via the plugin asset rendering route."
    published_at: "2021-12-07T00:00:00Z"
    cwe_id: "CWE-22"
    epistemic_status: "canonical"
    product:
      name: "Grafana"
      vendor: "Grafana Labs"
    component:
      name: "api_plugins"
      path: "pkg/api/plugins.go"
    version_ranges:
      - spec: ">= 8.0.0, <= 8.3.0"
        status: "affected"
    evidence:
      - evidence_id: "EVD-9f7f590cba6c8f34"
        kind: "advisory"
        source_ref: "https://github.com/grafana/grafana/security/advisories/GHSA-8pjx-jj86-j47p"
        source_hash: "sha256:9f7f590cba6c8f341ce1ca89e243d7d58f2d39592c58515bb48b22441ccbdd1b"
        excerpt: "The /public/plugins/<plugin-id>/ endpoint contains a directory traversal vulnerability allowing reading of arbitrary files from the filesystem."
    facts:
      input_vector: "URL_PATH"
      input_parameter: "plugin_path"
      mechanism: "UNSANITIZED_FILE_PATH_CONCAT"
      impact: "ARBITRARY_FILE_READ"
      precondition: "INSTALLED_PLUGIN_EXISTS"

  - vuln_id: "CVE-2023-38646"
    title: "Pre-authentication RCE in Metabase via H2 JDBC connection string"
    description: "Metabase allows unauthenticated users to execute arbitrary commands by submitting a crafted database validation request containing SQL injection in H2 connection parameters."
    published_at: "2023-07-20T00:00:00Z"
    cwe_id: "CWE-89"
    epistemic_status: "canonical"
    product:
      name: "Metabase"
      vendor: "Metabase"
    component:
      name: "api_setup"
      path: "api/session/properties"
    version_ranges:
      - spec: ">= 0.46.0, < 0.46.6.1"
        status: "affected"
    evidence:
      - evidence_id: "EVD-aa7a3ede75499e10"
        kind: "advisory"
        source_ref: "https://github.com/metabase/metabase/security/advisories/GHSA-vmm4-m2hm-8874"
        source_hash: "sha256:aa7a3ede75499e103b09ed247d733ac2f69c558bd4f8808eb4ee89af6f2adf4e"
        excerpt: "The /api/setup/validate endpoint accepts an unauthenticated request to validate database connection details, allowing SQL execution via H2 JDBC connection string."
    facts:
      input_vector: "JSON_BODY"
      input_parameter: "details.db"
      mechanism: "UNSAFE_JDBC_CONNECTION_STRING"
      impact: "CODE_EXECUTION"
      precondition: "SETUP_TOKEN_ACCESSIBLE"

